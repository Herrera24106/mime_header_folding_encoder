[project]
name = "mime-header-folding-encoder"
version = "0.1.0"
description = "Folds long email header lines according to RFC 5322, using both simple and RFC 2047 encoded-word folding."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
